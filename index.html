<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Meta Tags -->
    <title id="metaTitle">Tanveer Hussain | Cloud Architecture & Full-Stack CMS Engine</title>
    <meta id="metaDesc" name="description" content="High-performance custom cloud CMS engineered by Tanveer Hussain (@vexornull). Built for speed, brutal aesthetics, and absolute data control.">
    <meta name="keywords" content="Tanveer Hussain, vexornull, Custom CMS, Cloud Architecture, Full Stack Web Developer, Brutalist Design, Portfolio">
    <meta name="author" content="Tanveer Hussain (@vexornull)">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://vexornull.github.io/wp/">

    <!-- Open Graph / Facebook SEO -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vexornull.github.io/wp/">
    <meta id="ogTitle" property="og:title" content="Tanveer Hussain | Cloud Architecture & Full-Stack CMS Engine">
    <meta id="ogDesc" property="og:description" content="High-performance custom cloud CMS engineered for extreme speed and control.">
    <meta property="og:image" content="https://vexornull.github.io/wp/favicon.png">

    <!-- Twitter SEO -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://vexornull.github.io/wp/">
    <meta id="twTitle" property="twitter:title" content="Tanveer Hussain | Cloud Architecture & Full-Stack CMS Engine">
    <meta id="twDesc" property="twitter:description" content="High-performance custom cloud CMS engineered for extreme speed and control.">
    <meta property="twitter:image" content="https://vexornull.github.io/wp/favicon.png">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VexorNull Cloud Engine",
      "url": "https://vexornull.github.io/wp/",
      "author": {
        "@type": "Person",
        "name": "Tanveer Hussain",
        "alternateName": "vexornull",
        "sameAs": [
          "https://github.com/vexornull",
          "https://instagram.com/vexornull",
          "https://twitter.com/vexornull"
        ]
      }
    }
    </script>

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="https://vexornull.github.io/wp/favicon.png">
    <link rel="apple-touch-icon" href="https://vexornull.github.io/wp/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        brutYellow: '#FFE600',
                        brutLime: '#00FF66',
                        brutPink: '#FF007F',
                        brutCyan: '#00F0FF',
                        brutDark: '#121212',
                    },
                    boxShadow: {
                        'brut': '4px 4px 0px 0px #000000',
                        'brut-dark': '4px 4px 0px 0px #FFFFFF',
                        'brut-lg': '6px 6px 0px 0px #000000',
                    }
                }
            }
        }
    </script>
    <style>
        .brut-panel { 
            background: #FFFFFF; 
            border: 4px solid #000000; 
            box-shadow: 4px 4px 0px 0px #000000; 
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .brut-panel:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #000000;
        }
        .dark .brut-panel { 
            background: #1A1A1A; 
            border: 4px solid #FFFFFF; 
            box-shadow: 4px 4px 0px 0px #FFFFFF; 
        }
        .dark .brut-panel:hover {
            box-shadow: 6px 6px 0px 0px #FFFFFF;
        }
        
        .brut-btn {
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px 0px #000000;
            font-weight: 700;
            transition: all 0.05s ease;
        }
        .brut-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px 0px #000000;
        }
        .dark .brut-btn {
            border: 3px solid #FFFFFF;
            box-shadow: 3px 3px 0px 0px #FFFFFF;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #FFE600; border-left: 3px solid #000; }
        ::-webkit-scrollbar-thumb { background: #000000; border: 2px solid #FFE600; }
    </style>
</head>
<body class="h-full bg-[#F4F4F0] dark:bg-brutDark text-black dark:text-white font-sans antialiased flex flex-col justify-between selection:bg-brutYellow selection:text-black">

    <div id="app" class="flex-grow flex flex-col">
        <!-- Navigation Header -->
        <header class="sticky top-0 z-50 border-b-4 border-black dark:border-white bg-brutYellow dark:bg-neutral-900 transition-colors">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="router.navigate('home')">
                    <div id="navLogoIcon" class="w-12 h-12 border-3 border-black dark:border-white bg-brutPink flex items-center justify-center text-white shadow-[3px_3px_0px_0px_#000] font-black text-xl group-hover:rotate-6 transition-transform">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <div>
                        <span id="navSiteTitle" class="font-black text-xl tracking-tighter uppercase font-mono">TANVEER HUSSAIN</span>
                        <p class="text-xs font-bold font-mono bg-black text-white dark:bg-white dark:text-black px-1 inline-block mt-0.5">@VEXORNULL INFRASTRUCTURE</p>
                    </div>
                </div>

                <nav class="hidden md:flex items-center space-x-4 text-sm font-bold font-mono">
                    <button onclick="router.navigate('home')" class="px-4 py-2 bg-white dark:bg-neutral-800 border-2 border-black dark:border-white shadow-[2px_2px_0px_0px_#000] hover:translate-x-[-1px] hover:translate-y-[-1px] transition">HOME</button>
                    <button onclick="router.navigate('blog')" class="px-4 py-2 bg-white dark:bg-neutral-800 border-2 border-black dark:border-white shadow-[2px_2px_0px_0px_#000] hover:translate-x-[-1px] hover:translate-y-[-1px] transition">ARTICLES</button>
                </nav>

                <div class="flex items-center space-x-3">
                    <button id="themeToggleBtn" onclick="toggleTheme()" class="p-3 bg-white dark:bg-neutral-800 border-3 border-black dark:border-white shadow-[3px_3px_0px_0px_#000] hover:translate-x-[-1px] hover:translate-y-[-1px] transition">
                        <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                        <i class="fa-solid fa-sun hidden dark:block text-brutYellow text-lg"></i>
                    </button>
                    <div id="authNavArea">
                        <button onclick="openLoginModal()" class="brut-btn px-4 py-2.5 bg-brutCyan text-black rounded-none flex items-center gap-2 text-sm font-mono">
                            <i class="fa-solid fa-lock text-xs"></i> ADMIN PORTAL
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Dynamic Viewport -->
        <main id="mainContent" class="flex-grow flex flex-col">
            <!-- Dynamically populated views go here -->
        </main>
    </div>

    <footer class="border-t-4 border-black dark:border-white bg-white dark:bg-neutral-900 py-8 px-4 sm:px-8 mt-auto font-mono">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-sm font-bold">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="bg-black text-white dark:bg-white dark:text-black px-2 py-1">&copy; 2026 VEXORNULL ENGINE</span>
                <span>Designed & Engineered by</span>
                <a href="https://Instagram.com/vexornull" target="_blank" class="bg-brutYellow px-2 py-1 border-2 border-black text-black hover:underline">Tanveer Hussain (@vexornull)</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="https://github.com/vexornull" target="_blank" class="px-3 py-1 bg-brutCyan border-2 border-black text-black hover:bg-black hover:text-white transition flex items-center gap-1.5"><i class="fa-brands fa-github"></i> GITHUB</a>
                <a href="https://twitter.com/vexornull" target="_blank" class="px-3 py-1 bg-brutPink border-2 border-black text-white hover:bg-black transition flex items-center gap-1.5"><i class="fa-brands fa-twitter"></i> TWITTER</a>
            </div>
        </div>
    </footer>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-none hidden">
        <div class="brut-panel w-full max-w-md p-8 relative animate-in zoom-in-95 duration-100">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 w-10 h-10 bg-brutPink text-white border-2 border-black font-bold flex items-center justify-center hover:bg-black transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-brutYellow border-3 border-black text-black flex items-center justify-center mx-auto mb-3 shadow-[4px_4px_0px_0px_#000]">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h3 class="text-2xl font-black uppercase font-mono tracking-tight">System Control Panel</h3>
                <p class="text-xs font-mono font-bold mt-1 bg-black text-white py-0.5 px-2 inline-block">AUTHENTICATE ACCESS</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4 font-mono">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Admin Identity</label>
                    <input type="text" id="loginUser" required placeholder="Enter Username" class="w-full px-4 py-3 border-3 border-black dark:border-white bg-[#F4F4F0] dark:bg-neutral-800 focus:outline-none focus:bg-brutYellow/20 font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1">Access Token / Password</label>
                    <input type="password" id="loginPass" required placeholder="••••••••" class="w-full px-4 py-3 border-3 border-black dark:border-white bg-[#F4F4F0] dark:bg-neutral-800 focus:outline-none focus:bg-brutYellow/20 font-bold">
                </div>
                <div id="loginError" class="bg-brutPink text-white p-2 text-xs font-bold border-2 border-black hidden"></div>
                <button type="submit" class="brut-btn w-full py-3 bg-brutLime text-black uppercase font-mono">
                    AUTHENTICATE DASHBOARD
                </button>
            </form>
        </div>
    </div>

    <!-- Notification Modal -->
    <div id="notificationModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 hidden">
        <div class="brut-panel w-full max-w-sm p-6 text-center font-mono">
            <div id="notifIcon" class="w-14 h-14 border-3 border-black flex items-center justify-center mx-auto mb-3 text-black text-xl shadow-[3px_3px_0px_0px_#000]"></div>
            <h4 id="notifTitle" class="font-black text-xl uppercase mb-1">Notice</h4>
            <p id="notifMessage" class="text-sm font-bold mb-5"></p>
            <button onclick="closeNotification()" class="brut-btn w-full py-3 bg-brutYellow text-black uppercase">CONFIRM</button>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, set, get, update, remove, push, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            window.firebaseDB = { ref, set, get, update, remove, push, onValue, db };
        } catch (err) {
            console.error("Firebase init failed:", err);
        }
    </script>

    <script>
        let siteSettings = {
            title: "TANVEER HUSSAIN",
            tagline: "High-Performance Cloud Architecture & Web Systems",
            primaryColor: "yellow",
            heroTitle: "HIGH-SPEED CLOUD ENGINE. ZERO BLOAT.",
            heroSubtitle: "Engineered from scratch for speed, security, and full data control. Built by Tanveer Hussain (@vexornull)."
        };

        let posts = [];
        let comments = [];
        let searchQuery = "";
        let selectedCategory = "ALL";
        let analytics = { pageViews: 2450, uniqueVisitors: 1120, activePosts: 0, pendingComments: 0 };
        let isAdminLoggedIn = localStorage.getItem("vexornull_admin_logged") === "true";

        function updateSEOMeta(title, description) {
            const finalTitle = title ? `${title} | Tanveer Hussain Engine` : 'Tanveer Hussain | Cloud Architecture & Full-Stack Engine';
            const finalDesc = description || siteSettings.heroSubtitle;

            document.title = finalTitle;
            document.getElementById('metaTitle').innerText = finalTitle;
            document.getElementById('metaDesc').setAttribute('content', finalDesc);
            document.getElementById('ogTitle').setAttribute('content', finalTitle);
            document.getElementById('ogDesc').setAttribute('content', finalDesc);
            document.getElementById('twTitle').setAttribute('content', finalTitle);
            document.getElementById('twDesc').setAttribute('content', finalDesc);
        }

        function showNotification(title, message, type = 'success') {
            const modal = document.getElementById('notificationModal');
            const iconDiv = document.getElementById('notifIcon');
            document.getElementById('notifTitle').innerText = title;
            document.getElementById('notifMessage').innerText = message;
            
            iconDiv.className = type === 'success' 
                ? "w-14 h-14 border-3 border-black flex items-center justify-center mx-auto mb-3 bg-brutLime text-black text-xl shadow-[3px_3px_0px_0px_#000]"
                : "w-14 h-14 border-3 border-black flex items-center justify-center mx-auto mb-3 bg-brutPink text-white text-xl shadow-[3px_3px_0px_0px_#000]";
            iconDiv.innerHTML = type === 'success' ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-triangle-exclamation"></i>';
            
            modal.classList.remove('hidden');
        }

        function closeNotification() {
            document.getElementById('notificationModal').classList.add('hidden');
        }

        function openLoginModal() {
            if (isAdminLoggedIn) {
                router.navigate('dashboard');
                return;
            }
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginError').classList.add('hidden');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const errDiv = document.getElementById('loginError');

            // NEW UPDATED PASSWORD
            if (u === "Admin12345" && p === "##03422124300##") {
                isAdminLoggedIn = true;
                localStorage.setItem("vexornull_admin_logged", "true");
                closeLoginModal();
                updateAuthNav();
                showNotification("ACCESS GRANTED", "System control panel unlocked.");
                router.navigate('dashboard');
            } else {
                errDiv.innerText = "ACCESS DENIED: Authentication Failed.";
                errDiv.classList.remove('hidden');
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            localStorage.removeItem("vexornull_admin_logged");
            updateAuthNav();
            showNotification("LOGGED OUT", "System session closed.");
            router.navigate('home');
        }

        function updateAuthNav() {
            const area = document.getElementById('authNavArea');
            if (isAdminLoggedIn) {
                area.innerHTML = `
                    <div class="flex items-center gap-2">
                        <button onclick="router.navigate('dashboard')" class="brut-btn px-4 py-2 bg-brutLime text-black font-mono text-xs">
                            <i class="fa-solid fa-gauge"></i> DASHBOARD
                        </button>
                        <button onclick="adminLogout()" title="Logout" class="brut-btn p-2.5 bg-brutPink text-white">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                `;
            } else {
                area.innerHTML = `
                    <button onclick="openLoginModal()" class="brut-btn px-4 py-2 bg-brutCyan text-black text-xs font-mono">
                        <i class="fa-solid fa-lock"></i> ADMIN PORTAL
                    </button>
                `;
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('vexornull_theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('vexornull_theme', 'dark');
            }
        }

        if (localStorage.getItem('vexornull_theme') === 'dark' || (!('vexornull_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        const router = {
            current: 'home',
            navigate: function(view, param = null) {
                this.current = view;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                renderCurrentView(param);
            }
        };

        function calculateReadTime(text) {
            const words = text ? text.split(/\s+/).length : 0;
            const minutes = Math.ceil(words / 200);
            return `${minutes} MIN READ`;
        }

        function syncDataFromFirebase() {
            if (window.firebaseDB) {
                const { db, ref, onValue } = window.firebaseDB;
                
                onValue(ref(db, 'cms/settings'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        siteSettings = data;
                        document.getElementById('navSiteTitle').innerText = siteSettings.title;
                    }
                });

                onValue(ref(db, 'cms/posts'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        posts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                    } else {
                        posts = [];
                    }
                    if (['home', 'blog', 'dashboard'].includes(router.current)) {
                        renderCurrentView();
                    }
                });

                onValue(ref(db, 'cms/comments'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        comments = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                    } else {
                        comments = [];
                    }
                });
            } else {
                posts = [];
                comments = [];
                renderCurrentView();
            }
        }

        function filterPosts() {
            return posts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.content.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCat = selectedCategory === "ALL" || (p.category || 'GENERAL').toUpperCase() === selectedCategory;
                return matchesSearch && matchesCat;
            });
        }

        function renderCurrentView(param = null) {
            const container = document.getElementById('mainContent');
            updateAuthNav();

            switch(router.current) {
                case 'home':
                    updateSEOMeta("Home", siteSettings.heroSubtitle);
                    container.innerHTML = renderHomeView();
                    break;
                case 'blog':
                    updateSEOMeta("Articles & Engineering Notes", "Explore cloud architectures and full-stack software development articles.");
                    container.innerHTML = renderBlogView();
                    break;
                case 'postDetail':
                    const post = posts.find(p => p.id === param);
                    if (post) {
                        updateSEOMeta(post.title, post.content.substring(0, 150));
                    }
                    container.innerHTML = renderPostDetailView(param);
                    break;
                case 'dashboard':
                    if (!isAdminLoggedIn) {
                        openLoginModal();
                        router.navigate('home');
                        return;
                    }
                    updateSEOMeta("System Control Panel", "Manage infrastructure articles and global parameters.");
                    container.innerHTML = renderDashboardView();
                    initDashboardTabs();
                    break;
                default:
                    updateSEOMeta("Home", siteSettings.heroSubtitle);
                    container.innerHTML = renderHomeView();
            }
        }

        function renderHomeView() {
            const recentPosts = posts.slice(0, 3);
            return `
                <section class="relative py-16 lg:py-24 bg-brutYellow border-b-4 border-black dark:border-white dark:bg-neutral-900">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
                        <span class="inline-block px-4 py-1.5 font-mono text-xs font-bold bg-black text-brutYellow border-2 border-black mb-6 uppercase tracking-wider shadow-[3px_3px_0px_0px_#FFF]">
                            PROPRIETARY SYSTEM BY TANVEER HUSSAIN (@VEXORNULL)
                        </span>
                        <h1 class="text-4xl sm:text-7xl font-black tracking-tighter uppercase mb-6 max-w-5xl mx-auto font-mono">
                            ${siteSettings.heroTitle}
                        </h1>
                        <p class="text-base sm:text-xl font-bold max-w-2xl mx-auto mb-10 font-mono bg-white dark:bg-black p-3 border-3 border-black dark:border-white shadow-[4px_4px_0px_0px_#000]">
                            ${siteSettings.heroSubtitle}
                        </p>
                        <div class="flex flex-wrap justify-center gap-4 font-mono">
                            <button onclick="router.navigate('blog')" class="brut-btn px-8 py-4 bg-brutLime text-black uppercase text-base">
                                EXPLORE ARTICLES (${posts.length})
                            </button>
                        </div>
                    </div>
                </section>

                <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 w-full">
                    <div class="flex items-center justify-between mb-8 pb-4 border-b-4 border-black dark:border-white">
                        <div>
                            <h2 class="text-3xl font-black uppercase tracking-tight font-mono">FEATURED PUBLICATION</h2>
                            <p class="text-xs font-mono font-bold text-gray-600 dark:text-gray-400">REAL-TIME DATA DISPATCH ENGINE</p>
                        </div>
                        <button onclick="router.navigate('blog')" class="brut-btn px-4 py-2 bg-brutCyan text-black text-xs font-mono">
                            VIEW ALL ARTICLES &rarr;
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${recentPosts.length === 0 ? `
                            <div class="col-span-3 brut-panel p-12 text-center font-mono">
                                <h3 class="text-xl font-bold mb-2">NO PUBLICATIONS FOUND</h3>
                                <p class="text-xs text-gray-500 mb-6">System ready. Authenticate Admin Portal to publish content.</p>
                                <button onclick="openLoginModal()" class="brut-btn px-6 py-3 bg-brutYellow text-black text-xs uppercase">ADMIN PORTAL LOGIN</button>
                            </div>
                        ` : recentPosts.map(p => `
                            <div class="brut-panel p-6 flex flex-col justify-between cursor-pointer group" onclick="router.navigate('postDetail', '${p.id}')">
                                <div>
                                    <div class="flex items-center justify-between mb-4 font-mono">
                                        <span class="px-2.5 py-1 bg-brutCyan text-black text-xs font-bold border-2 border-black">${p.category || 'GENERAL'}</span>
                                        <span class="text-xs font-bold bg-black text-white px-2 py-0.5">${calculateReadTime(p.content)}</span>
                                    </div>
                                    <h3 class="font-black text-xl mb-3 group-hover:underline uppercase font-mono">${p.title}</h3>
                                    <p class="text-sm font-mono line-clamp-3 mb-6 text-gray-700 dark:text-gray-300">${p.content}</p>
                                </div>
                                <div class="flex items-center justify-between pt-4 border-t-2 border-black dark:border-white font-mono text-xs font-bold">
                                    <span>BY ${p.author || 'TANVEER'}</span>
                                    <span class="bg-black text-white dark:bg-white dark:text-black px-2 py-1">READ NOW &rarr;</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
        }

        function renderBlogView() {
            const categories = ["ALL", ...new Set(posts.map(p => (p.category || 'GENERAL').toUpperCase()))];
            const filtered = filterPosts();

            return `
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full font-mono">
                    <div class="mb-10 text-center pb-6 border-b-4 border-black dark:border-white">
                        <h1 class="text-4xl font-black uppercase mb-2">ENGINEERING ARTICLES & NOTES</h1>
                        <p class="text-xs font-bold bg-brutYellow text-black inline-block px-3 py-1 border-2 border-black uppercase">SEARCH AND FILTER CONTENT DATABASE</p>
                    </div>

                    <!-- Search & Filter Controls -->
                    <div class="mb-10 flex flex-col md:flex-row gap-4 items-center justify-between">
                        <!-- Search Bar -->
                        <div class="relative w-full md:w-1/2">
                            <input type="text" id="searchInput" value="${searchQuery}" oninput="handleSearch(this.value)" placeholder="SEARCH ARTICLES BY TITLE OR CONTENT..." class="w-full px-4 py-3 border-3 border-black dark:border-white bg-white dark:bg-neutral-800 text-xs font-bold focus:outline-none focus:bg-brutYellow/20">
                            <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-black dark:text-white"></i>
                        </div>

                        <!-- Category Filter Buttons -->
                        <div class="flex flex-wrap gap-2 w-full md:w-auto">
                            ${categories.map(cat => `
                                <button onclick="setCategory('${cat}')" class="px-3 py-2 text-xs font-bold border-2 border-black transition ${selectedCategory === cat ? 'bg-brutLime text-black font-black shadow-[2px_2px_0px_0px_#000]' : 'bg-white dark:bg-neutral-800 text-black dark:text-white'}">
                                    ${cat}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${filtered.length === 0 ? `
                            <div class="col-span-full brut-panel p-12 text-center">
                                <h3 class="text-xl font-bold mb-2">NO MATCHING ARTICLES FOUND</h3>
                                <p class="text-xs text-gray-500 mb-4">Try clearing your search query or selecting a different category.</p>
                            </div>
                        ` : filtered.map(p => `
                            <div class="brut-panel p-6 flex flex-col justify-between cursor-pointer" onclick="router.navigate('postDetail', '${p.id}')">
                                <div>
                                    <div class="flex items-center justify-between mb-4">
                                        <span class="px-2 py-1 bg-brutPink text-white text-xs font-bold border-2 border-black">${p.category || 'GENERAL'}</span>
                                        <span class="text-xs font-bold bg-black text-white px-2 py-0.5">${calculateReadTime(p.content)}</span>
                                    </div>
                                    <h3 class="font-black text-xl mb-3 uppercase">${p.title}</h3>
                                    <p class="text-sm line-clamp-3 mb-6 text-gray-700 dark:text-gray-300">${p.content}</p>
                                </div>
                                <div class="flex items-center justify-between pt-4 border-t-2 border-black dark:border-white text-xs font-bold">
                                    <span>${p.author || 'TANVEER'}</span>
                                    <span class="bg-black text-white dark:bg-white dark:text-black px-2 py-1">READ NOW &rarr;</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleSearch(val) {
            searchQuery = val;
            renderCurrentView();
            // Refocus input after re-render
            setTimeout(() => {
                const el = document.getElementById('searchInput');
                if(el) {
                    el.focus();
                    el.setSelectionRange(val.length, val.length);
                }
            }, 50);
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCurrentView();
        }

        function renderPostDetailView(postId) {
            const post = posts.find(p => p.id === postId) || posts[0];
            if (!post) return `<div class="p-12 text-center font-mono">Article not found in database.</div>`;
            const postComments = comments.filter(c => c.postId === post.id);

            return `
                <article class="max-w-4xl mx-auto px-4 py-12 w-full font-mono">
                    <button onclick="router.navigate('blog')" class="brut-btn px-4 py-2 bg-brutYellow text-black text-xs font-bold mb-6 inline-flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> BACK TO ARTICLES
                    </button>
                    <div class="flex flex-wrap items-center gap-3 mb-4 text-xs font-bold">
                        <span class="px-3 py-1 bg-brutCyan text-black border-2 border-black">${post.category || 'GENERAL'}</span>
                        <span class="bg-black text-white px-2 py-1">${post.date}</span>
                        <span class="bg-brutPink text-white px-2 py-1">BY ${post.author || 'TANVEER'}</span>
                        <span class="bg-brutLime text-black px-2 py-1 border border-black">${calculateReadTime(post.content)}</span>
                    </div>
                    <h1 class="text-3xl sm:text-5xl font-black mb-8 uppercase tracking-tight">${post.title}</h1>
                    
                    <div class="brut-panel p-8 text-base leading-relaxed mb-12 whitespace-pre-wrap font-sans">
                        ${post.content}
                    </div>

                    <!-- Comments Section -->
                    <div class="border-t-4 border-black dark:border-white pt-10">
                        <h3 class="text-2xl font-black uppercase mb-6">READER DISCUSSIONS (${postComments.length})</h3>
                        <div class="space-y-4 mb-8">
                            ${postComments.length === 0 ? '<p class="text-xs font-bold text-gray-500 bg-white dark:bg-neutral-800 p-4 border-2 border-black">No comments recorded yet. Join the conversation below.</p>' : postComments.map(c => `
                                <div class="brut-panel p-4">
                                    <div class="flex items-center justify-between mb-2 text-xs font-bold">
                                        <span class="bg-brutYellow text-black px-2 py-0.5 border border-black">${c.author}</span>
                                        <span>${c.date}</span>
                                    </div>
                                    <p class="text-sm font-sans">${c.comment}</p>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Add Comment Form -->
                        <form onsubmit="handleCommentSubmit(event, '${post.id}')" class="brut-panel p-6 space-y-4">
                            <h4 class="font-black text-lg uppercase">POST YOUR RESPONSE</h4>
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Your Name</label>
                                <input type="text" id="commentAuthor" required placeholder="Full Name" class="w-full px-4 py-2.5 border-3 border-black bg-white dark:bg-neutral-800 text-sm font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase mb-1">Your Comment</label>
                                <textarea id="commentText" required rows="3" placeholder="Write your response..." class="w-full px-4 py-2.5 border-3 border-black bg-white dark:bg-neutral-800 text-sm font-bold"></textarea>
                            </div>
                            <button type="submit" class="brut-btn px-6 py-3 bg-brutLime text-black text-xs uppercase">
                                SUBMIT RESPONSE
                            </button>
                        </form>
                    </div>
                </article>
            `;
        }

        function handleCommentSubmit(e, postId) {
            e.preventDefault();
            const author = document.getElementById('commentAuthor').value;
            const comment = document.getElementById('commentText').value;
            const newComment = {
                postId,
                author,
                comment,
                date: new Date().toISOString().split('T')[0]
            };

            if (window.firebaseDB) {
                const { db, ref, push } = window.firebaseDB;
                push(ref(db, 'cms/comments'), newComment);
            } else {
                comments.push({ id: 'c_' + Date.now(), ...newComment });
            }

            showNotification("SUCCESS", "Comment published successfully.");
            router.navigate('postDetail', postId);
        }

        function renderDashboardView() {
            return `
                <div class="flex flex-col lg:flex-row flex-grow font-mono">
                    <aside class="w-full lg:w-72 border-r-4 border-black dark:border-white bg-white dark:bg-neutral-900 p-6 flex flex-col justify-between">
                        <div class="space-y-6">
                            <div class="flex items-center gap-3 p-3 bg-brutYellow text-black border-3 border-black shadow-[3px_3px_0px_0px_#000]">
                                <div class="w-10 h-10 bg-black text-white flex items-center justify-center font-black">A</div>
                                <div>
                                    <h4 class="font-black text-xs uppercase">ADMINISTRATOR</h4>
                                    <p class="text-[10px] font-bold text-emerald-700">● SECURE SESSION</p>
                                </div>
                            </div>
                            <nav class="space-y-2 text-xs font-bold">
                                <button onclick="switchAdminTab('posts')" id="tabBtn-posts" class="w-full flex items-center gap-3 px-4 py-3 bg-brutYellow text-black border-3 border-black shadow-[3px_3px_0px_0px_#000]">
                                    <i class="fa-solid fa-file-lines w-5"></i> MANAGE POSTS (${posts.length})
                                </button>
                                <button onclick="switchAdminTab('settings')" id="tabBtn-settings" class="w-full flex items-center gap-3 px-4 py-3 bg-white dark:bg-neutral-800 border-3 border-black dark:border-white">
                                    <i class="fa-solid fa-gear w-5"></i> SITE SETTINGS
                                </button>
                                <button onclick="switchAdminTab('comments')" id="tabBtn-comments" class="w-full flex items-center gap-3 px-4 py-3 bg-white dark:bg-neutral-800 border-3 border-black dark:border-white">
                                    <i class="fa-solid fa-comments w-5"></i> COMMENTS (${comments.length})
                                </button>
                                <button onclick="switchAdminTab('analytics')" id="tabBtn-analytics" class="w-full flex items-center gap-3 px-4 py-3 bg-white dark:bg-neutral-800 border-3 border-black dark:border-white">
                                    <i class="fa-solid fa-chart-line w-5"></i> ANALYTICS
                                </button>
                            </nav>
                        </div>
                        <div class="pt-6 border-t-2 border-black dark:border-white">
                            <button onclick="adminLogout()" class="brut-btn w-full py-3 bg-brutPink text-white text-xs uppercase">
                                <i class="fa-solid fa-power-off"></i> EXIT SYSTEM
                            </button>
                        </div>
                    </aside>

                    <div class="flex-grow p-6 lg:p-10 bg-[#F4F4F0] dark:bg-neutral-950">
                        <!-- Posts Tab -->
                        <div id="adminTab-posts" class="admin-tab space-y-6">
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                <div>
                                    <h2 class="text-3xl font-black uppercase">PUBLICATION CONTROL</h2>
                                    <p class="text-xs font-bold text-gray-600">Create, edit, or delete articles stored on cloud database.</p>
                                </div>
                                <button onclick="openPostModal()" class="brut-btn px-5 py-3 bg-brutLime text-black text-xs uppercase flex items-center gap-2">
                                    <i class="fa-solid fa-plus"></i> CREATE ARTICLE
                                </button>
                            </div>

                            <div class="brut-panel overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr class="border-b-4 border-black dark:border-white bg-brutYellow text-black font-black uppercase">
                                                <th class="p-4">Title</th>
                                                <th class="p-4">Category</th>
                                                <th class="p-4">Author</th>
                                                <th class="p-4">Date</th>
                                                <th class="p-4 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y-2 divide-black dark:divide-white font-bold">
                                            ${posts.length === 0 ? `<tr><td colspan="5" class="p-8 text-center text-gray-500">No articles created yet. Click 'CREATE ARTICLE' above.</td></tr>` : posts.map(p => `
                                                <tr class="hover:bg-brutYellow/20 transition">
                                                    <td class="p-4 font-black">${p.title}</td>
                                                    <td class="p-4"><span class="px-2 py-0.5 bg-brutCyan text-black border border-black">${p.category || 'GENERAL'}</span></td>
                                                    <td class="p-4">${p.author || 'Tanveer'}</td>
                                                    <td class="p-4">${p.date}</td>
                                                    <td class="p-4 text-right space-x-2">
                                                        <button onclick="editPost('${p.id}')" class="px-2.5 py-1.5 bg-brutYellow text-black border-2 border-black font-bold">EDIT</button>
                                                        <button onclick="deletePost('${p.id}')" class="px-2.5 py-1.5 bg-brutPink text-white border-2 border-black font-bold">DEL</button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Settings Tab -->
                        <div id="adminTab-settings" class="admin-tab space-y-6 hidden">
                            <div>
                                <h2 class="text-3xl font-black uppercase">SYSTEM CONFIGURATION</h2>
                                <p class="text-xs font-bold text-gray-600">Modify global website branding & hero parameters.</p>
                            </div>
                            <form onsubmit="saveSiteSettings(event)" class="brut-panel p-8 space-y-6 max-w-3xl">
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Site Brand Title</label>
                                    <input type="text" id="settingTitle" value="${siteSettings.title}" required class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800 text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Tagline</label>
                                    <input type="text" id="settingTagline" value="${siteSettings.tagline}" required class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800 text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Hero Section Title</label>
                                    <input type="text" id="settingHeroTitle" value="${siteSettings.heroTitle}" required class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800 text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase mb-1">Hero Subtitle Text</label>
                                    <textarea id="settingHeroSubtitle" rows="2" required class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800 text-xs font-bold">${siteSettings.heroSubtitle}</textarea>
                                </div>
                                <button type="submit" class="brut-btn px-8 py-3 bg-brutLime text-black text-xs uppercase">
                                    SAVE CONFIGURATION
                                </button>
                            </form>
                        </div>

                        <!-- Comments Tab -->
                        <div id="adminTab-comments" class="admin-tab space-y-6 hidden">
                            <div>
                                <h2 class="text-3xl font-black uppercase">DISCUSSIONS & MODERATION</h2>
                                <p class="text-xs font-bold text-gray-600">Manage reader feedback.</p>
                            </div>
                            <div class="brut-panel overflow-hidden">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="border-b-4 border-black dark:border-white bg-brutYellow text-black font-black uppercase">
                                            <th class="p-4">Author</th>
                                            <th class="p-4">Comment</th>
                                            <th class="p-4">Date</th>
                                            <th class="p-4 text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y-2 divide-black font-bold">
                                        ${comments.length === 0 ? `<tr><td colspan="4" class="p-8 text-center text-gray-500">No responses recorded.</td></tr>` : comments.map(c => `
                                            <tr>
                                                <td class="p-4 font-black">${c.author}</td>
                                                <td class="p-4 max-w-xs truncate">${c.comment}</td>
                                                <td class="p-4">${c.date}</td>
                                                <td class="p-4 text-right">
                                                    <button onclick="deleteComment('${c.id}')" class="px-2.5 py-1 bg-brutPink text-white border-2 border-black">DELETE</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Analytics Tab -->
                        <div id="adminTab-analytics" class="admin-tab space-y-6 hidden">
                            <div>
                                <h2 class="text-3xl font-black uppercase">ANALYTICS & METRICS</h2>
                                <p class="text-xs font-bold text-gray-600">Engine activity stats.</p>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="brut-panel p-6 flex items-center gap-4">
                                    <div class="w-14 h-14 bg-brutYellow border-3 border-black flex items-center justify-center text-xl font-black">👁️</div>
                                    <div>
                                        <span class="text-xs font-bold uppercase text-gray-500">Page Hits</span>
                                        <h3 class="text-2xl font-black">${analytics.pageViews}</h3>
                                    </div>
                                </div>
                                <div class="brut-panel p-6 flex items-center gap-4">
                                    <div class="w-14 h-14 bg-brutCyan border-3 border-black flex items-center justify-center text-xl font-black">👥</div>
                                    <div>
                                        <span class="text-xs font-bold uppercase text-gray-500">Unique Users</span>
                                        <h3 class="text-2xl font-black">${analytics.uniqueVisitors}</h3>
                                    </div>
                                </div>
                                <div class="brut-panel p-6 flex items-center gap-4">
                                    <div class="w-14 h-14 bg-brutLime border-3 border-black flex items-center justify-center text-xl font-black">📝</div>
                                    <div>
                                        <span class="text-xs font-bold uppercase text-gray-500">Total Publications</span>
                                        <h3 class="text-2xl font-black">${posts.length}</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Post Modal -->
                <div id="postModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 hidden">
                    <div class="brut-panel w-full max-w-xl p-8 relative font-mono">
                        <button onclick="closePostModal()" class="absolute top-4 right-4 w-10 h-10 bg-brutPink text-white border-2 border-black font-bold flex items-center justify-center">✕</button>
                        <h3 id="postModalTitle" class="text-2xl font-black uppercase mb-6">NEW ARTICLE</h3>
                        <form onsubmit="handlePostFormSubmit(event)" class="space-y-4 text-xs font-bold">
                            <input type="hidden" id="editPostId">
                            <div>
                                <label class="block uppercase mb-1">Article Title</label>
                                <input type="text" id="postTitleInput" required placeholder="Title..." class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block uppercase mb-1">Category</label>
                                    <input type="text" id="postCategoryInput" required placeholder="Architecture, Tutorial..." class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800">
                                </div>
                                <div>
                                    <label class="block uppercase mb-1">Author</label>
                                    <input type="text" id="postAuthorInput" value="Tanveer Hussain" required class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800">
                                </div>
                            </div>
                            <div>
                                <label class="block uppercase mb-1">Content Body</label>
                                <textarea id="postContentInput" required rows="5" placeholder="Write article content..." class="w-full px-4 py-3 border-3 border-black bg-white dark:bg-neutral-800 font-sans"></textarea>
                            </div>
                            <button type="submit" class="brut-btn w-full py-3 bg-brutLime text-black uppercase">
                                DISPATCH PUBLICATION
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function switchAdminTab(tabName) {
            document.querySelectorAll('.admin-tab').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('aside nav button').forEach(el => {
                el.classList.remove('bg-brutYellow', 'shadow-[3px_3px_0px_0px_#000]');
                el.classList.add('bg-white', 'dark:bg-neutral-800');
            });
            document.getElementById(`adminTab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tabBtn-${tabName}`);
            activeBtn.classList.add('bg-brutYellow', 'shadow-[3px_3px_0px_0px_#000]');
            activeBtn.classList.remove('bg-white', 'dark:bg-neutral-800');
        }

        function initDashboardTabs() {
            switchAdminTab('posts');
        }

        function openPostModal(post = null) {
            const modal = document.getElementById('postModal');
            document.getElementById('editPostId').value = post ? post.id : '';
            document.getElementById('postModalTitle').innerText = post ? 'EDIT ARTICLE' : 'NEW ARTICLE';
            document.getElementById('postTitleInput').value = post ? post.title : '';
            document.getElementById('postCategoryInput').value = post ? post.category : '';
            document.getElementById('postAuthorInput').value = post ? post.author : 'Tanveer Hussain';
            document.getElementById('postContentInput').value = post ? post.content : '';
            modal.classList.remove('hidden');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        function handlePostFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editPostId').value;
            const title = document.getElementById('postTitleInput').value;
            const category = document.getElementById('postCategoryInput').value;
            const author = document.getElementById('postAuthorInput').value;
            const content = document.getElementById('postContentInput').value;
            const date = new Date().toISOString().split('T')[0];

            const postData = { title, category, author, content, date };

            if (window.firebaseDB) {
                const { db, ref, set, push } = window.firebaseDB;
                if (id) {
                    set(ref(db, `cms/posts/${id}`), postData);
                } else {
                    const newRef = push(ref(db, 'cms/posts'));
                    set(newRef, postData);
                }
            } else {
                if (id) {
                    const idx = posts.findIndex(p => p.id === id);
                    if (idx !== -1) posts[idx] = { id, ...postData };
                } else {
                    posts.push({ id: 'p_' + Date.now(), ...postData });
                }
            }

            closePostModal();
            showNotification("SUCCESS", "Publication synced successfully.");
            router.navigate('dashboard');
        }

        function editPost(id) {
            const post = posts.find(p => p.id === id);
            if (post) openPostModal(post);
        }

        function deletePost(id) {
            if (window.firebaseDB) {
                const { db, ref, remove } = window.firebaseDB;
                remove(ref(db, `cms/posts/${id}`));
            } else {
                posts = posts.filter(p => p.id !== id);
            }
            showNotification("DELETED", "Publication removed.");
            router.navigate('dashboard');
        }

        function saveSiteSettings(e) {
            e.preventDefault();
            siteSettings.title = document.getElementById('settingTitle').value;
            siteSettings.tagline = document.getElementById('settingTagline').value;
            siteSettings.heroTitle = document.getElementById('settingHeroTitle').value;
            siteSettings.heroSubtitle = document.getElementById('settingHeroSubtitle').value;

            if (window.firebaseDB) {
                const { db, ref, set } = window.firebaseDB;
                set(ref(db, 'cms/settings'), siteSettings);
            }

            document.getElementById('navSiteTitle').innerText = siteSettings.title;
            showNotification("SAVED", "Configuration updated successfully.");
        }

        function deleteComment(id) {
            if (window.firebaseDB) {
                const { db, ref, remove } = window.firebaseDB;
                remove(ref(db, `cms/comments/${id}`));
            } else {
                comments = comments.filter(c => c.id !== id);
            }
            showNotification("DELETED", "Response removed.");
            router.navigate('dashboard');
        }

        window.onload = function() {
            syncDataFromFirebase();
            router.navigate('home');
        };
    </script>
</body>
</html>
